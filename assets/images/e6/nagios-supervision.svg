<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="Schéma : tableau de bord de supervision Nagios avec l'état des hôtes et des services, et alertes par mail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" rx="14" fill="url(#bg)"/>

  <!-- Fenêtre du tableau de bord -->
  <rect x="20" y="20" width="300" height="230" rx="8" fill="#0b1220" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="20" y="20" width="300" height="24" rx="8" fill="#38bdf8" fill-opacity="0.15"/>
  <circle cx="34" cy="32" r="4" fill="#ff5f56"/><circle cx="47" cy="32" r="4" fill="#ffbd2e"/><circle cx="60" cy="32" r="4" fill="#27c93f"/>
  <text x="170" y="36" text-anchor="middle" font-family="monospace" font-size="11" fill="#cbd5e1">Nagios · État des services</text>

  <g font-family="monospace" font-size="11">
    <text x="34" y="66" fill="#94a3b8">HÔTE</text><text x="140" y="66" fill="#94a3b8">SERVICE</text><text x="262" y="66" fill="#94a3b8">ÉTAT</text>
    <line x1="30" y1="72" x2="310" y2="72" stroke="#ffffff" stroke-opacity="0.1"/>

    <text x="34" y="94" fill="#ffffff">SRV-AD</text><text x="140" y="94" fill="#cbd5e1">CPU</text>
    <rect x="258" y="83" width="44" height="15" rx="3" fill="#10b981"/><text x="280" y="94" text-anchor="middle" fill="#0f172a" font-weight="bold">OK</text>

    <text x="34" y="120" fill="#ffffff">SRV-AD</text><text x="140" y="120" fill="#cbd5e1">Service DNS</text>
    <rect x="258" y="109" width="44" height="15" rx="3" fill="#10b981"/><text x="280" y="120" text-anchor="middle" fill="#0f172a" font-weight="bold">OK</text>

    <text x="34" y="146" fill="#ffffff">SRV-LINUX</text><text x="140" y="146" fill="#cbd5e1">Disque /</text>
    <rect x="258" y="135" width="44" height="15" rx="3" fill="#ffbd2e"/><text x="280" y="146" text-anchor="middle" fill="#0f172a" font-weight="bold">WARN</text>

    <text x="34" y="172" fill="#ffffff">PC-CLIENT</text><text x="140" y="172" fill="#cbd5e1">RAM</text>
    <rect x="258" y="161" width="44" height="15" rx="3" fill="#10b981"/><text x="280" y="172" text-anchor="middle" fill="#0f172a" font-weight="bold">OK</text>

    <text x="34" y="198" fill="#ffffff">SRV-LINUX</text><text x="140" y="198" fill="#cbd5e1">Service SSH</text>
    <rect x="258" y="187" width="44" height="15" rx="3" fill="#ff5f56"/><text x="280" y="198" text-anchor="middle" fill="#0f172a" font-weight="bold">CRIT</text>

    <text x="34" y="232" fill="#38bdf8">5 services · 1 alerte critique</text>
  </g>

  <!-- Alerte mail -->
  <path d="M320 195 C 350 195, 350 120, 372 120" fill="none" stroke="#ff5f56" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="372" y="88" width="88" height="64" rx="8" fill="#ff5f56" fill-opacity="0.12" stroke="#ff5f56" stroke-width="2"/>
  <rect x="392" y="102" width="48" height="32" rx="3" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M392 104 L416 122 L440 104" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="416" y="172" text-anchor="middle" font-family="monospace" font-size="11" fill="#ff5f56">Alerte mail</text>
  <text x="416" y="188" text-anchor="middle" font-family="monospace" font-size="10" fill="#cbd5e1">vers l'admin</text>
</svg>
