<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompteur Oral - Paul-Yann (Intégral)</title>
    <style>
        body {
            background-color: #111;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 0 8%;
            overflow-y: auto; 
        }
        #titre-partie {
            color: #ff5f56;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            margin-top: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            flex-shrink: 0;
        }
        #texte-prompteur {
            font-size: 2rem; 
            line-height: 1.5;
            text-align: center;
            max-width: 1200px;
            padding-bottom: 4rem; 
        }
        .instructions {
            position: fixed;
            bottom: 15px;
            font-size: 1rem;
            color: #777;
            background-color: #111;
            padding: 5px 15px;
            border-radius: 20px;
        }
        .highlight {
            color: #4da6ff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="titre-partie">Prêt pour l'oral ?</div>
    <div id="texte-prompteur">Appuie sur ESPACE ou ➔ pour commencer la présentation.<br><br><span style="font-size: 1.2rem; color: #777;">(Ou navigue sur ton portfolio pour synchroniser automatiquement)</span></div>
    <div class="instructions">Espace / Flèche Droite : Suivant | Flèche Gauche : Précédent</div>

    <script>
        const slides = [
            {
                titre: "1. Accueil",
                texte: "Bonjour à toutes et à tous. Je m'appelle Paul-Yann Bouvier et je suis ravi de vous présenter aujourd'hui mon portfolio.<br><br>Passionné par l'informatique et les nouvelles technologies, je suis actuellement étudiant en BTS SIO option SISR. Mon objectif à terme est de travailler dans le domaine des réseaux informatiques, bien que je n'aie pas encore défini vers quel métier spécifique je souhaite m'orienter concrètement pour la suite.<br><br>Dès la page d'accueil, j'ai voulu afficher clairement mon identité avec un design immersif. On y retrouve immédiatement ma Stack technique, c'est-à-dire les environnements sur lesquels je travaille : Windows, Linux, Cisco, VMware et les bases de données SQL. J'y ai également mis en évidence mon statut actuel : je suis en alternance chez Paritel, au sein du support technique client."
            },
            {
                titre: "2. À propos",
                texte: "En passant sur la page À propos, je me présente plus en détail sous forme de terminal de commande. Je vis à Rueil-Malmaison et je me définis comme quelqu'un de curieux et rigoureux. J'ai classé mes compétences en trois catégories : les systèmes et la virtualisation, les réseaux avec l'écosystème Cisco, et enfin le développement et les outils.<br><br>Vous pouvez également y suivre mon parcours : l'obtention de mon Bac STI2D SIN au Lycée Richelieu, ma formation Socle Numérique à l'EPSI Paris, et mes stages chez Global Knowledge où j'ai pu configurer un réseau avec routeur Cisco, déployer des environnements virtualisés sous VMware et administrer des systèmes Windows et Linux.<br><br>Bien sûr, cette page permet de télécharger directement mon CV en PDF ou d'accéder à mon profil LinkedIn."
            },
            {
                titre: "3. BTS SIO",
                texte: "La rubrique suivante est dédiée à mon diplôme, sur la page BTS SIO. J'y explique en détail les deux spécialités de ce cursus.<br><br>D'un côté, il y a la spécialité SLAM (Solutions Logicielles et Applications Métiers), qui forme au développement d'applications informatiques et de logiciels.<br><br>De l'autre côté, il y a la spécialité SISR (Solutions d'Infrastructure, Systèmes et Réseaux), qui forme des administrateurs et techniciens de réseaux et de systèmes.<br><br>C'est évidemment ce second parcours que j'ai choisi, pour apprendre à gérer des parcs informatiques, à sécuriser des systèmes d'information et surtout à administrer des réseaux."
            },
            {
                titre: "4. École & Entreprise",
                texte: "Dans la continuité de cette formation, nous passons à la page École & Entreprise, qui détaille ma situation du moment.<br><br>Je suis actuellement étudiant à Paris YNOV Campus pour la promotion 2025-2027.<br><br>Pour mettre en pratique mes apprentissages, je suis <span class='highlight'>apprenti support technique client chez Paritel</span>, à Bois-Colombes, depuis août 2026. J'y assiste les clients dans la résolution de leurs incidents réseaux et télécoms : diagnostic, suivi et accompagnement des utilisateurs."
            },
            {
                titre: "5. Réalisations (E5)",
                texte: "J'en viens au cœur de l'épreuve E5 : la page Réalisations professionnelles.<br><br>Elle s'ouvre sur les <span class='highlight'>six compétences du bloc 1</span>, puis sur mon <span class='highlight'>tableau de synthèse</span>, qui croise chaque réalisation avec les compétences qu'elle mobilise. En cliquant sur une compétence, je peux filtrer directement les réalisations correspondantes.<br><br>Chaque fiche précise le contexte, l'environnement technique, les compétences et donne accès à la documentation PDF complète.<br><br><span class='highlight'>Côté Réseau :</span> VLAN et trunks 802.1Q, redondance avec Spanning Tree, DHCP avec relais et routage statique sur Cisco.<br><br><span class='highlight'>Côté Système :</span> Debian 12, serveur Apache sécurisé en HTTPS, GLPI pour la gestion de parc et le helpdesk, OCS Inventory pour l'inventaire.<br><br>S'y ajoutent ce portfolio lui-même, pour la présence en ligne, et mon activité de support chez Paritel pour la gestion des incidents."
            },
            {
                titre: "6. Projets & Veille",
                texte: "Concernant la page Projets (E6), elle est actuellement affichée en cours de déploiement. Les projets de professionnalisation relatifs à cette épreuve sont en cours de documentation et seront ajoutés très prochainement à mon portfolio.<br><br>Enfin, la page Veille présente ma veille technologique, qui répond à la compétence C6 « Organiser son développement professionnel ».<br><br>J'y applique une méthode en quatre étapes : collecter, trier, vérifier auprès d'une source officielle, puis synthétiser.<br><br>Elle couvre la période de <span class='highlight'>septembre 2025 à aujourd'hui</span>, sur deux thématiques. D'abord la cybersécurité des systèmes d'exploitation : les zero-day des pare-feu Cisco ASA en septembre 2025, la faille critique de WSUS en octobre, la faille Linux « Dirty Frag », le Patch Tuesday record de septembre 2026 avec 966 failles, et la fin de la première année d'ESU de Windows 10 le 13 octobre 2026. Ensuite l'automatisation de l'administration système : Sysmon intégré à Windows, PowerShell 7.6, Grafana 13, et l'ouverture d'Ansible aux agents IA.<br><br>Ce que j'en retiens : l'IA est désormais utilisée des deux côtés, mais les fondamentaux restent les mêmes : connaître son parc, corriger en priorisant, sauvegarder et superviser.<br><br>Mes sources principales sont Google Actualités, le CERT-FR, IT-Connect et LinkedIn."
            },
            {
                titre: "7. Contact & Conclusion",
                texte: "Enfin, la visite du site se termine logiquement par la page Contact. J'y ai regroupé l'ensemble de mes coordonnées : adresse e-mail, ma localisation à Rueil-Malmaison, ainsi qu'un lien direct vers mon profil LinkedIn. J'ai également intégré un formulaire de contact fonctionnel, pensé comme un protocole de message sécurisé, pour faciliter les échanges.<br><br>Pour conclure, ce portfolio a été conçu par mes soins pour montrer ma capacité à structurer l'information et à présenter mes premières compétences techniques en systèmes et réseaux. Je vous remercie pour votre attention, et je suis à votre disposition si vous souhaitez approfondir l'une des réalisations que je viens de vous présenter."
            }
        ];

        let currentIndex = -1;
        const titreDiv = document.getElementById('titre-partie');
        const texteDiv = document.getElementById('texte-prompteur');

        function updateSlide() {
            window.scrollTo(0, 0); 
            
            if (currentIndex >= 0 && currentIndex < slides.length) {
                titreDiv.innerHTML = slides[currentIndex].titre;
                texteDiv.innerHTML = slides[currentIndex].texte;
            } else if (currentIndex >= slides.length) {
                titreDiv.innerHTML = "🏁 Terminé !";
                texteDiv.innerHTML = "Bravo ! Respire, souris et attends les questions du jury.";
            }
        }

        document.addEventListener('keydown', (e) => {
            if(e.code === 'Space') e.preventDefault(); 
            
            if (e.code === 'Space' || e.code === 'ArrowRight') {
                currentIndex++;
                if (currentIndex > slides.length) currentIndex = slides.length;
                updateSlide();
            } else if (e.code === 'ArrowLeft') {
                currentIndex--;
                if (currentIndex < 0) currentIndex = 0;
                updateSlide();
            }
        });

        window.addEventListener('storage', (event) => {
            if (event.key === 'portfolioTrigger') {
                const page = localStorage.getItem('portfolioPage');
                
                if (page.includes('apropos')) {
                    currentIndex = 1; 
                } 
                else if (page.includes('bts-sio')) {
                    currentIndex = 2; 
                } 
                else if (page.includes('ecole-entreprise')) {
                    currentIndex = 3; 
                } 
                else if (page.includes('missions')) {
                    currentIndex = 4; 
                } 
                else if (page.includes('projets') || page.includes('veille')) {
                    currentIndex = 5; 
                } 
                else if (page.includes('contact')) {
                    currentIndex = 6; 
                } 
                else {
                    currentIndex = 0; 
                }
                
                updateSlide();
            }
        });
    </script>
</body>
</html>
