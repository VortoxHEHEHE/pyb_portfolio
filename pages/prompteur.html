<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompteur Oral - Paul-Yann (Intégral)</title>
    <style>
        body {
            background-color: #111;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 0 8%;
            overflow-y: auto; /* Permet de scroller si le texte est long */
        }
        #titre-partie {
            color: #ff5f56;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            margin-top: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            flex-shrink: 0;
        }
        #texte-prompteur {
            font-size: 2rem; /* Taille idéale pour les gros paragraphes */
            line-height: 1.5;
            text-align: center;
            max-width: 1200px;
            padding-bottom: 4rem; /* Espace en bas pour respirer */
        }
        .instructions {
            position: fixed;
            bottom: 15px;
            font-size: 1rem;
            color: #777;
            background-color: #111;
            padding: 5px 15px;
            border-radius: 20px;
        }
        .highlight {
            color: #4da6ff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="titre-partie">Prêt pour l'oral ?</div>
    <div id="texte-prompteur">Appuie sur ESPACE ou ➔ pour commencer la présentation.<br><br><span style="font-size: 1.2rem; color: #777;">(Ou navigue sur ton portfolio pour synchroniser automatiquement)</span></div>
    <div class="instructions">Espace / Flèche Droite : Suivant | Flèche Gauche : Précédent</div>

    <script>
        // Le texte intégral à 100%, regroupé par pages pour coller avec la synchro
        const slides = [
            {
                titre: "1. Accueil",
                texte: "Bonjour à toutes et à tous. Je m'appelle Paul-Yann Bouvier et je suis ravi de vous présenter aujourd'hui mon portfolio.<br><br>Passionné par l'informatique et les nouvelles technologies, je suis actuellement étudiant en BTS SIO option SISR. Mon objectif à terme est de travailler dans le domaine des réseaux informatiques, bien que je n'aie pas encore défini vers quel métier spécifique je souhaite m'orienter concrètement pour la suite.<br><br>Dès la page d'accueil, j'ai voulu afficher clairement mon identité avec un design immersif. On y retrouve immédiatement ma Stack technique, c'est-à-dire les environnements sur lesquels je travaille : Windows, Linux, Cisco, VMware et les bases de données SQL. J'y ai également mis en évidence mon statut actuel : je suis ouvert aux opportunités et en recherche active d'une alternance."
            },
            {
                titre: "2. À propos",
                texte: "En passant sur la page À propos, je me présente plus en détail sous forme de terminal de commande. Je vis à Rueil-Malmaison et je me définis comme quelqu'un de curieux et rigoureux. J'ai classé mes compétences en trois catégories : les systèmes et la virtualisation, les réseaux avec l'écosystème Cisco, et enfin le développement et les outils.<br><br>Vous pouvez également y suivre mon parcours : l'obtention de mon Bac STI2D SIN au Lycée Richelieu, ma formation Socle Numérique à l'EPSI Paris, et mes stages chez Global Knowledge où j'ai pu configurer un réseau avec routeur Cisco, déployer des environnements virtualisés sous VMware et administrer des systèmes Windows et Linux.<br><br>Bien sûr, cette page permet de télécharger directement mon CV en PDF ou de consulter mon code source sur GitHub."
            },
            {
                titre: "3. BTS SIO",
                texte: "La rubrique suivante est dédiée à mon diplôme, sur la page BTS SIO. J'y explique en détail les deux spécialités de ce cursus.<br><br>D'un côté, il y a la spécialité SLAM (Solutions Logicielles et Applications Métiers), qui forme au développement d'applications informatiques et de logiciels.<br><br>De l'autre côté, il y a la spécialité SISR (Solutions d'Infrastructure, Systèmes et Réseaux), qui forme des administrateurs et techniciens de réseaux et de systèmes.<br><br>C'est évidemment ce second parcours que j'ai choisi, pour apprendre à gérer des parcs informatiques, à sécuriser des systèmes d'information et surtout à administrer des réseaux."
            },
            {
                titre: "4. École & Entreprise",
                texte: "Dans la continuité de cette formation, nous passons à la page École & Entreprise, qui détaille ma situation du moment.<br><br>Je suis actuellement étudiant à Paris YNOV Campus pour la promotion 2025-2027.<br><br>Surtout, pour mettre en pratique mes apprentissages, j'y ai placé une alerte bien visible concernant ma recherche d'alternance : je cherche activement un poste (idéalement axé Systèmes et Réseaux pour découvrir le métier), avec un rythme de 2 jours à l'école et 3 jours en entreprise."
            },
            {
                titre: "5. Missions (U5)",
                texte: "Fort de ces enseignements, j'aimerais maintenant attirer votre attention sur la page Missions, qui concentre les travaux réalisés dans le cadre de mon épreuve U5. C'est ici que je démontre concrètement ce que je sais faire en pratique. Le contenu est présenté sous forme de cartes d'identité de missions, toutes validées, avec un accès direct à leur documentation PDF.<br><br>J'y expose 8 grands projets, dont notamment :<br><br><span class='highlight'>Côté Réseau :</span> La configuration de VLANs et de Trunking 802.1Q, la mise en place de la redondance LAN avec le protocole Spanning Tree, ou encore des projets de DHCP et de routage statique sur matériel Cisco.<br><br><span class='highlight'>Côté Système :</span> L'installation de A à Z d'un environnement Debian 12, sur lequel j'ai ensuite pu sécuriser un serveur Web Apache, et déployer des solutions professionnelles comme GLPI (gestion de parc) et OCS Inventory."
            },
            {
                titre: "6. Projets & Veille",
                texte: "Concernant la page Projets (U6), elle est actuellement affichée en cours de déploiement. Les projets de professionnalisation relatifs à cette épreuve sont en cours de documentation et seront ajoutés très prochainement à mon portfolio.<br><br>Il en est de même pour la page Veille, dédiée à l'épreuve U4. Le sujet de ma veille technologique étant actuellement en cours de définition, j'ai mis en place une interface simulant un radar et un terminal de scan en attendant d'y publier mes futures analyses."
            },
            {
                titre: "7. Contact & Conclusion",
                texte: "Enfin, la visite du site se termine logiquement par la page Contact. J'y ai regroupé l'ensemble de mes coordonnées : numéro de téléphone, adresse e-mail, ma localisation à Rueil-Malmaison, ainsi qu'un lien direct vers mon profil LinkedIn. J'ai également intégré un formulaire de contact fonctionnel, pensé comme un protocole de message sécurisé, pour faciliter les échanges concernant ma recherche d'alternance.<br><br>Pour conclure, ce portfolio a été conçu par mes soins pour montrer ma capacité à structurer l'information et à présenter mes premières compétences techniques en systèmes et réseaux. Je vous remercie pour votre attention, et je suis à votre disposition si vous souhaitez approfondir l'une des missions que je viens de vous présenter."
            }
        ];

        let currentIndex = -1;
        const titreDiv = document.getElementById('titre-partie');
        const texteDiv = document.getElementById('texte-prompteur');

        function updateSlide() {
            // Remonter tout en haut de la page quand on change de diapo
            window.scrollTo(0, 0); 
            
            if (currentIndex >= 0 && currentIndex < slides.length) {
                titreDiv.innerHTML = slides[currentIndex].titre;
                texteDiv.innerHTML = slides[currentIndex].texte;
            } else if (currentIndex >= slides.length) {
                titreDiv.innerHTML = "🏁 Terminé !";
                texteDiv.innerHTML = "Bravo ! Respire, souris et attends les questions du jury.";
            }
        }

        // Navigation manuelle (Espace / Flèches)
        document.addEventListener('keydown', (e) => {
            // Empêcher la barre d'espace de faire défiler la page vers le bas brutalement
            if(e.code === 'Space') e.preventDefault(); 
            
            if (e.code === 'Space' || e.code === 'ArrowRight') {
                currentIndex++;
                if (currentIndex > slides.length) currentIndex = slides.length;
                updateSlide();
            } else if (e.code === 'ArrowLeft') {
                currentIndex--;
                if (currentIndex < 0) currentIndex = 0;
                updateSlide();
            }
        });

        // --- SYNCHRONISATION AUTOMATIQUE AVEC LE PORTFOLIO ---
        window.addEventListener('storage', (event) => {
            if (event.key === 'portfolioTrigger') {
                const page = localStorage.getItem('portfolioPage');
                
                if (page.includes('apropos')) {
                    currentIndex = 1; // À propos
                } 
                else if (page.includes('bts-sio')) {
                    currentIndex = 2; // BTS SIO
                } 
                else if (page.includes('ecole-entreprise')) {
                    currentIndex = 3; // École & Entreprise
                } 
                else if (page.includes('missions')) {
                    currentIndex = 4; // Missions
                } 
                else if (page.includes('projets') || page.includes('veille')) {
                    currentIndex = 5; // Projets / Veille
                } 
                else if (page.includes('contact')) {
                    currentIndex = 6; // Contact
                } 
                else {
                    currentIndex = 0; // Accueil
                }
                
                updateSlide();
            }
        });
    </script>
</body>
</html>
