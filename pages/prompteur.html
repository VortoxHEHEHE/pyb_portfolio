<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompteur Oral - Paul-Yann (Intégral)</title>
    <style>
        body {
            background-color: #111;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: safe center; /* centre sans couper le haut des longues diapos */
            height: 100vh;
            margin: 0;
            padding: 0 8%;
            overflow-y: auto; 
        }
        #titre-partie {
            color: #ff5f56;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            margin-top: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            flex-shrink: 0;
        }
        #texte-prompteur {
            font-size: 2rem; 
            line-height: 1.5;
            text-align: center;
            max-width: 1200px;
            padding-bottom: 4rem; 
        }
        .instructions {
            position: fixed;
            bottom: 15px;
            font-size: 1rem;
            color: #777;
            background-color: #111;
            padding: 5px 15px;
            border-radius: 20px;
        }
        .highlight {
            color: #4da6ff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="titre-partie">Prêt pour l'oral ?</div>
    <div id="texte-prompteur">Appuie sur ESPACE ou ➔ pour commencer la présentation.<br><br><span style="font-size: 1.2rem; color: #777;">(Ou navigue sur ton portfolio pour synchroniser automatiquement)</span></div>
    <div class="instructions">Espace / Flèche Droite : Suivant | Flèche Gauche : Précédent</div>

    <script>
        const slides = [
            {
                titre: "1. Accueil & Profil",
                texte: "Bonjour à toutes et à tous. Je m'appelle Paul-Yann Bouvier, je suis étudiant en <span class='highlight'>BTS SIO option SISR</span> à Paris Ynov Campus, et je suis ravi de vous présenter mon portfolio.<br><br>La page d'accueil sert aussi de présentation : dès l'arrivée, on voit mon nom, mon poste d'apprenti technicien support et mon alternance chez <span class='highlight'>Paritel</span>, avec trois accès rapides : mon profil, mon CV et le contact.<br><br>Juste en dessous, mon profil : mes compétences en systèmes et virtualisation, en réseaux avec Cisco, et en développement et outils.<br><br>Puis mon parcours : mon alternance chez Paritel depuis août 2026, mon stage d'assistant informatique chez Global Knowledge cet été, mon BTS à Ynov, mon premier stage chez Global Knowledge en 2023, l'EPSI et mon Bac STI2D SIN."
            },
            {
                titre: "2. Épreuve E5",
                texte: "Je passe à l'<span class='highlight'>épreuve E5</span>, Support et mise à disposition de services informatiques.<br><br>La page s'ouvre directement sur mon <span class='highlight'>tableau de synthèse officiel</span>, consultable en plein écran.<br><br>En dessous, la liste de mes réalisations : un clic sur le logo ouvre la documentation PDF.<br><br><span class='highlight'>Côté réseau :</span> DHCP avec relais, routage statique, VLAN et redondance avec Spanning Tree sur du matériel Cisco.<br><br><span class='highlight'>Côté système :</span> l'installation de Debian 12, un serveur web Apache sécurisé, GLPI pour la gestion de parc et OCS Inventory pour l'inventaire.<br><br>S'y ajoutent ce portfolio, pour la présence en ligne, et ma veille technologique."
            },
            {
                titre: "3. Épreuve E6",
                texte: "La page suivante présente l'<span class='highlight'>épreuve E6</span>, Administration des systèmes et des réseaux, qui évalue les compétences du bloc 2 : concevoir, déployer, administrer et sécuriser une infrastructure.<br><br>Elle repose sur <span class='highlight'>deux situations professionnelles</span> autour de la même entreprise : la première met en place l'infrastructure, la seconde la supervise.<br><br>Pour chaque projet, j'indique le contexte, l'architecture, ce que j'ai réalisé et les tests effectués.<br><br>Les deux <span class='highlight'>fiches descriptives</span> sont consultables en PDF directement depuis la page, et la documentation technique viendra les compléter."
            },
            {
                titre: "4. Entreprise",
                texte: "La page Entreprise présente mon alternance chez <span class='highlight'>Paritel</span>.<br><br>Paritel est un opérateur télécom et informatique pour les professionnels, créé en 1987. Il fournit aux TPE et PME leur téléphonie fixe et mobile, leur accès internet en fibre et la sécurité de leur réseau, avec 35 agences en France et plus de 15 000 clients.<br><br>Le siège est à Bois-Colombes, où je travaille depuis le 17 août 2026 comme <span class='highlight'>apprenti support technique client</span> : je diagnostique et je résous les incidents réseaux et télécoms des clients, et je les accompagne jusqu'à la résolution.<br><br>On y retrouve aussi la fiche d'identité de l'entreprise et sa localisation sur une carte."
            },
            {
                titre: "5. Veille technologique",
                texte: "Ma <span class='highlight'>veille technologique</span> répond à la compétence C6, Organiser son développement professionnel.<br><br>Dès le haut de la page, on choisit l'une de mes <span class='highlight'>deux thématiques</span> en cliquant dessus, et les articles s'affichent juste en dessous.<br><br><span class='highlight'>Première thématique, la cybersécurité des systèmes d'exploitation :</span> la fin de la première année d'ESU de Windows 10, le Patch Tuesday record de septembre 2026 avec 966 failles, l'été record des rançongiciels, la faille Linux « Dirty Frag », la faille critique de WSUS et les zero-day des pare-feu Cisco ASA.<br><br><span class='highlight'>Seconde thématique, l'automatisation de l'administration système :</span> Ansible ouvert aux agents IA, Grafana 13, PowerShell 7.6 et Sysmon intégré à Windows.<br><br>Chaque article indique sa source et ce qu'il change concrètement pour un administrateur.<br><br>Ce que j'en retiens : l'IA est utilisée des deux côtés, mais les fondamentaux restent les mêmes : connaître son parc, corriger en priorisant, sauvegarder et superviser.<br><br>Ma méthode : collecter, trier, vérifier auprès d'une source officielle, puis synthétiser, avec Google Actualités, le CERT-FR, IT-Connect et LinkedIn."
            },
            {
                titre: "6. Contact & Conclusion",
                texte: "La visite se termine par la page Contact : mon adresse e-mail, ma localisation, mon profil LinkedIn et un formulaire de contact fonctionnel.<br><br>Pour conclure, j'ai conçu ce portfolio moi-même, de son code jusqu'à son nom de domaine, pour présenter clairement mes réalisations et mes compétences en systèmes et réseaux.<br><br>Je vous remercie pour votre attention, et je suis à votre disposition pour approfondir l'une des réalisations que je viens de vous présenter."
            }
        ];

        let currentIndex = -1;
        const titreDiv = document.getElementById('titre-partie');
        const texteDiv = document.getElementById('texte-prompteur');

        function updateSlide() {
            window.scrollTo(0, 0); 
            
            if (currentIndex >= 0 && currentIndex < slides.length) {
                titreDiv.innerHTML = slides[currentIndex].titre;
                texteDiv.innerHTML = slides[currentIndex].texte;
            } else if (currentIndex >= slides.length) {
                titreDiv.innerHTML = "🏁 Terminé !";
                texteDiv.innerHTML = "Bravo ! Respire, souris et attends les questions du jury.";
            }
        }

        document.addEventListener('keydown', (e) => {
            if(e.code === 'Space') e.preventDefault(); 
            
            if (e.code === 'Space' || e.code === 'ArrowRight') {
                currentIndex++;
                if (currentIndex > slides.length) currentIndex = slides.length;
                updateSlide();
            } else if (e.code === 'ArrowLeft') {
                currentIndex--;
                if (currentIndex < 0) currentIndex = 0;
                updateSlide();
            }
        });

        window.addEventListener('storage', (event) => {
            if (event.key === 'portfolioTrigger') {
                const page = localStorage.getItem('portfolioPage');
                
                // Chaque page du portfolio affiche la diapo correspondante
                if (page.includes('missions')) {
                    currentIndex = 1;
                }
                else if (page.includes('projets')) {
                    currentIndex = 2;
                }
                else if (page.includes('entreprise')) {
                    currentIndex = 3;
                }
                else if (page.includes('veille')) {
                    currentIndex = 4;
                }
                else if (page.includes('contact')) {
                    currentIndex = 5;
                }
                else {
                    currentIndex = 0;
                }

                updateSlide();
            }
        });
    </script>
</body>
</html>
